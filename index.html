<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="플랜두씨 다이어리 (PDS Diary) — 계획(Plan) → 실행(Do) → 돌아보기(See)로 이어지는 해리포터풍 감성 양장본 다이어리">
  <meta name="theme-color" content="#2c1a0e">
  <title>P.D.S Canvas — 플랜두씨 다이어리</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d4af37'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A4.5 4.5 0 0 0 2 6.5v13H4z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- 세션 및 탭 상태 즉각 복원 (새로고침 시 로그인 화면 및 이전 화면 깜빡임 FOUC 원천 방지) -->
  <script>
    (function () {
      try {
        var hasSession = false;
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1) {
            var raw = localStorage.getItem(k);
            if (raw && (raw.indexOf('access_token') !== -1 || raw.indexOf('"user"') !== -1)) {
              hasSession = true;
              break;
            }
          }
        }
        var savedTab = localStorage.getItem('pds_active_tab') || 'plans';
        var docEl = document.documentElement;
        if (hasSession) {
          docEl.classList.add('has-auth-session');
          docEl.setAttribute('data-initial-tab', savedTab);
        } else {
          docEl.classList.add('is-guest-session');
        }

        var savedTheme = localStorage.getItem('pds_theme');
        if (savedTheme === 'dark') {
          docEl.classList.add('candlelight-theme');
        }
      } catch (e) { }
    })();
  </script>
  <style id="authFoucPreventStyle">
    /* 0ms 초기 렌더링 즉시 적용: 세션 보유 시 로그인 표지 숨김 & 메인 앱 노출 */
    html.has-auth-session #authScreen {
      display: none !important;
    }

    html.has-auth-session #app {
      display: block !important;
    }

    html.is-guest-session #authScreen {
      display: flex !important;
    }

    html.is-guest-session #app {
      display: none !important;
    }

    /* 새로고침 시 이전에 보던 활성 탭 즉시 렌더 (기본 계획 탭 깜빡임 방지) */
    html.has-auth-session[data-initial-tab="calendar"] #tabPlans,
    html.has-auth-session[data-initial-tab="todos"] #tabPlans,
    html.has-auth-session[data-initial-tab="records"] #tabPlans,
    html.has-auth-session[data-initial-tab="vlog"] #tabPlans,
    html.has-auth-session[data-initial-tab="review"] #tabPlans {
      display: none !important;
    }

    html.has-auth-session[data-initial-tab="calendar"] .tab[data-tab="plans"],
    html.has-auth-session[data-initial-tab="todos"] .tab[data-tab="plans"],
    html.has-auth-session[data-initial-tab="records"] .tab[data-tab="plans"],
    html.has-auth-session[data-initial-tab="vlog"] .tab[data-tab="plans"],
    html.has-auth-session[data-initial-tab="review"] .tab[data-tab="plans"] {
      color: var(--text3, #8c7b70) !important;
      background: none !important;
      border-color: transparent !important;
      border-top: 1.5px solid transparent !important;
      box-shadow: none !important;
    }

    html.has-auth-session[data-initial-tab="calendar"] #tabCalendar {
      display: block !important;
    }

    html.has-auth-session[data-initial-tab="todos"] #tabTodos {
      display: block !important;
    }

    html.has-auth-session[data-initial-tab="records"] #tabRecords {
      display: block !important;
    }

    html.has-auth-session[data-initial-tab="vlog"] #tabVlog {
      display: block !important;
    }

    html.has-auth-session[data-initial-tab="review"] #tabReview {
      display: block !important;
    }

    html.has-auth-session[data-initial-tab="calendar"] .tab[data-tab="calendar"],
    html.has-auth-session[data-initial-tab="todos"] .tab[data-tab="todos"],
    html.has-auth-session[data-initial-tab="records"] .tab[data-tab="records"],
    html.has-auth-session[data-initial-tab="vlog"] .tab[data-tab="vlog"],
    html.has-auth-session[data-initial-tab="review"] .tab[data-tab="review"] {
      color: var(--accent, #7a2021) !important;
      background: var(--paper, #fbf9f4) !important;
      border-color: var(--border, #d8cca3) !important;
      border-top: 3px solid var(--accent, #7a2021) !important;
      box-shadow: 0 -3px 8px rgba(0, 0, 0, 0.04) !important;
    }
  </style>
</head>

<body>
  <script>
    if (document.documentElement.classList.contains('candlelight-theme')) {
      document.body.classList.add('candlelight-theme');
    }
  </script>
  <!-- 오프라인 상태 감지 및 복구 알림 띠 (고도화 요소 1) -->
  <div id="offlineNoticeBanner" class="offline-banner" hidden>
    <div class="offline-banner-content">
      <span class="offline-icon-pulse"></span>
      <span id="offlineBannerText">인터넷 연결이 끊겼습니다. 네트워크가 재연결될 때까지 대기합니다.</span>
    </div>
  </div>

  <!-- [과제 7] 첫 화면: 웅장하고 부드러운 해리포터풍 마법 양장본 다이어리 (Harry Potter Hardcover 3D Scene) -->
  <section id="authScreen" class="auth-book-scene">
    <!-- 로그인 화면 캔들라이트 테마 퀵 토글 컨트롤 -->
    <div class="auth-theme-floating-bar">
      <button id="authThemeToggleBtn" class="auth-theme-toggle-btn" type="button" title="심야 서재 캔들라이트 모드 ON/OFF"
        aria-label="캔들라이트 모드 토글">
        <svg class="theme-icon-candle" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2c.6 1.5 2 2.5 2 4 0 1.5-1 2.5-2 3-1-.5-2-1.5-2-3 0-1.5 1.4-2.5 2-4z" fill="#d4af37"
            stroke="none" />
          <path d="M9 9h6v12H9z" />
          <path d="M7 21h10" />
        </svg>
        <span id="authThemeToggleText">캔들라이트 모드</span>
        <span id="authThemeBadge" class="auth-theme-status-pill">OFF</span>
      </button>
    </div>

    <div id="closedDiaryBook" class="closed-diary-book harry-potter-book">
      <!-- 앤틱 가죽 책등(Spine) & 엠보싱 골드 리브 밴드 -->
      <div class="diary-book-spine">
        <span class="spine-rib-band"></span>
        <span class="spine-rib-band"></span>
        <span class="spine-rib-band"></span>
        <span class="spine-rib-band"></span>
        <span class="spine-rib-band"></span>
      </div>
      <!-- 버건디 새틴 가름끈 리본 -->
      <div class="diary-ribbon"></div>

      <!-- 3D 앞표지 (로그인 성공 시 3D로 스르륵 오픈) -->
      <div class="diary-front-cover" id="diaryFrontCover">
        <!-- 해리포터풍 부드러운 골드 필리그리 & 코너 아라베스크 테두리 장식 -->
        <div class="filigree-frame">
          <svg class="filigree-corner tl" viewBox="0 0 44 44" fill="none">
            <path d="M4 40V14C4 8.5 8.5 4 14 4H40" stroke="url(#goldGradient)" stroke-width="2"
              stroke-linecap="round" />
            <path d="M10 40V18C10 13.6 13.6 10 18 10H40" stroke="url(#goldGradient)" stroke-width="1.1"
              stroke-dasharray="2.5 2" opacity="0.8" />
            <circle cx="16" cy="16" r="3" fill="url(#goldGradient)" />
            <circle cx="28" cy="10" r="1.5" fill="url(#goldGradient)" />
            <circle cx="10" cy="28" r="1.5" fill="url(#goldGradient)" />
          </svg>
          <svg class="filigree-corner tr" viewBox="0 0 44 44" fill="none">
            <path d="M40 40V14C40 8.5 35.5 4 30 4H4" stroke="url(#goldGradient)" stroke-width="2"
              stroke-linecap="round" />
            <path d="M34 40V18C34 13.6 30.4 10 26 10H4" stroke="url(#goldGradient)" stroke-width="1.1"
              stroke-dasharray="2.5 2" opacity="0.8" />
            <circle cx="28" cy="16" r="3" fill="url(#goldGradient)" />
            <circle cx="16" cy="10" r="1.5" fill="url(#goldGradient)" />
            <circle cx="34" cy="28" r="1.5" fill="url(#goldGradient)" />
          </svg>
          <svg class="filigree-corner bl" viewBox="0 0 44 44" fill="none">
            <path d="M4 4V30C4 35.5 8.5 40 14 40H40" stroke="url(#goldGradient)" stroke-width="2"
              stroke-linecap="round" />
            <path d="M10 4V26C10 30.4 13.6 34 18 34H40" stroke="url(#goldGradient)" stroke-width="1.1"
              stroke-dasharray="2.5 2" opacity="0.8" />
            <circle cx="16" cy="28" r="3" fill="url(#goldGradient)" />
            <circle cx="28" cy="34" r="1.5" fill="url(#goldGradient)" />
            <circle cx="10" cy="16" r="1.5" fill="url(#goldGradient)" />
          </svg>
          <svg class="filigree-corner br" viewBox="0 0 44 44" fill="none">
            <path d="M40 4V30C40 35.5 35.5 40 30 40H4" stroke="url(#goldGradient)" stroke-width="2"
              stroke-linecap="round" />
            <path d="M34 4V26C34 30.4 30.4 34 26 34H4" stroke="url(#goldGradient)" stroke-width="1.1"
              stroke-dasharray="2.5 2" opacity="0.8" />
            <circle cx="28" cy="28" r="3" fill="url(#goldGradient)" />
            <circle cx="16" cy="34" r="1.5" fill="url(#goldGradient)" />
            <circle cx="34" cy="16" r="1.5" fill="url(#goldGradient)" />
          </svg>
          <div class="filigree-border-outer"></div>
          <div class="filigree-border-inner"></div>
        </div>

        <!-- 호그와트풍 P.D.S 앤틱 골드 크레스트 (Royal Seal Crest) -->
        <div class="cover-header">
          <div class="hp-crest-emblem">
            <svg width="74" height="74" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- 방패 외곽 골드 프레임 -->
              <path d="M50 8 L82 22 V52 C82 72 50 92 50 92 C50 92 18 72 18 52 V22 Z" stroke="url(#goldGradient)"
                stroke-width="2.5" fill="rgba(12, 22, 40, 0.75)" filter="url(#goldGlow)" />
              <path d="M50 14 L76 26 V50 C76 66 50 84 50 84 C50 84 24 66 24 50 V26 Z" stroke="url(#goldGradient)"
                stroke-width="1.2" stroke-dasharray="3 2" fill="none" opacity="0.8" />
              <!-- 4분할 격자 라인 -->
              <line x1="50" y1="18" x2="50" y2="82" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.7" />
              <line x1="26" y1="46" x2="74" y2="46" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.7" />
              <!-- 중앙 PDS 모노그램 -->
              <circle cx="50" cy="46" r="14" fill="#0d192d" stroke="url(#goldGradient)" stroke-width="1.8" />
              <text x="50" y="52" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif"
                font-weight="bold" font-size="14" fill="url(#goldGradient)" letter-spacing="1">PDS</text>
              <!-- 상단 왕관 장식 -->
              <path d="M40 18 L50 11 L60 18 L56 22 L44 22 Z" fill="url(#goldGradient)" opacity="0.9" />
              <circle cx="50" cy="11" r="1.5" fill="#fff" />
              <!-- 그라디언트 정의 -->
              <defs>
                <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffe6a3" />
                  <stop offset="35%" stop-color="#dfaa52" />
                  <stop offset="70%" stop-color="#c1872b" />
                  <stop offset="100%" stop-color="#fff2c2" />
                </linearGradient>
                <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
                  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffd56b" flood-opacity="0.3" />
                </filter>
              </defs>
            </svg>
          </div>
          <h1 class="cover-title hp-title">P.D.S Canvas</h1>
          <div class="cover-subtitle hp-subtitle">PLAN · DO · SEE DIARY</div>
        </div>

        <!-- 마그네틱 자물쇠 씰 (로그인 시 언락 애니메이션) -->
        <div class="lock-strap-accent hp-strap">
          <div class="lock-buckle hp-buckle" id="lockBuckle">
            <svg class="lock-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path id="lockShackle" d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </div>
        </div>

        <!-- 스위치 슬라이더 (로그인 / 회원가입 부드러운 스위치 플립 전환) -->
        <div class="switch-toggle-wrap">
          <div class="switch-toggle hp-switch" id="authSwitchToggle">
            <div class="switch-slider hp-slider" id="switchSlider"></div>
            <button type="button" class="switch-option active" id="authTabLogin">로그인</button>
            <button type="button" class="switch-option" id="authTabSignup">회원가입</button>
          </div>
        </div>

        <!-- 안내 및 에러 메시지 (T07-C99 계정 열거 방지) -->
        <div id="authErrorMsg" class="auth-msg-box" hidden role="alert"></div>

        <!-- 폼 영역 (표지 내지 패널 형태) -->
        <form id="authForm" class="auth-form hp-form" onsubmit="return false;">
          <div class="auth-field">
            <label for="authEmail" id="authEmailLabel">계정 이메일</label>
            <input type="email" id="authEmail" class="auth-input hp-input" placeholder="example@domain.com" required
              autocomplete="email">
          </div>
          <div class="auth-field">
            <label for="authPassword">비밀번호</label>
            <input type="password" id="authPassword" class="auth-input hp-input" placeholder="비밀번호 (6자 이상)" required
              autocomplete="current-password">
          </div>
          <button type="submit" id="authSubmitBtn" class="auth-open-book-btn hp-btn">
            <span id="authSubmitText">다이어리 열기</span>
            <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <div class="auth-footer-help">
          <p id="authToggleHelp">
            아직 다이어리 계정이 없으신가요?
            <button type="button" id="authSwitchModeBtn" class="auth-link-btn hp-link">새 계정 만들기</button>
          </p>
        </div>
      </div>
    </div>
  </section>

  <!-- 메인 다이어리 영역 (로그인 전에는 완전히 차단/숨김) -->
  <div id="app" hidden>
    <div id="diaryMainWrapper" class="diary-main-wrapper">
      <!-- 헤더 -->
      <header class="header">
        <h1 class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          </svg>
          P.D.S Canvas
        </h1>
        <div class="header-actions">
          <!-- [과제 7] 트렌디한 프로필 & 계정 상태 드롭다운 셀렉트 박스 -->
          <div id="userProfileArea" class="user-profile-area" style="display: none;">
            <div id="accountDropdownWrap" class="account-dropdown-wrap">
              <button id="accountTriggerBtn" class="account-trigger-btn" type="button" aria-haspopup="menu"
                aria-expanded="false" title="내 계정 관리">
                <span class="user-avatar-badge" id="headerAvatarWrap">
                  <span id="headerAvatarContent">
                    <span class="avatar-eyes-emoji" style="font-size: 14px; line-height: 1;">👀</span>
                  </span>
                  <span class="status-indicator-dot" title="보안 세션 활성화"></span>
                </span>
                <span id="userEmailText" class="user-email-text"></span>
                <svg class="chevron-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9" />
                </svg>
              </button>

              <!-- 드롭다운 메뉴 레이어 -->
              <div id="accountMenuDropdown" class="account-menu-dropdown" role="menu">
                <div class="account-menu-header">
                  <div class="menu-user-row">
                    <div class="menu-avatar" id="dropdownAvatarWrap">
                      <span class="avatar-eyes-emoji" style="font-size: 19px; line-height: 1;">👀</span>
                    </div>
                    <div class="menu-user-info">
                      <div class="dropdown-name-row">
                        <span id="dropdownUserName" class="dropdown-user-name"></span>
                        <span class="dropdown-badge-tag">MEMBER</span>
                      </div>
                      <span id="dropdownUserEmail" class="dropdown-email"></span>
                      <span class="dropdown-status-badge">
                        <span class="status-dot"></span> 보안 보호 중
                      </span>
                    </div>
                  </div>
                </div>
                <div class="account-menu-divider"></div>
                <div class="account-menu-actions">
                  <button id="editProfileBtn" class="account-menu-item" type="button" role="menuitem">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round">
                      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg>
                    <span>프로필 수정</span>
                  </button>
                  <button id="logoutBtn" class="account-menu-item" type="button" role="menuitem">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round">
                      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                      <polyline points="16 17 21 12 16 7" />
                      <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    <span>로그아웃</span>
                  </button>
                  <button id="deleteAccountBtn" class="account-menu-item danger" type="button" role="menuitem">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="3 6 5 6 21 6" />
                      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    </svg>
                    <span>회원 탈퇴 및 기록 영구 삭제</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <!-- 심야 서재 캔들라이트 테마 스위치 (고도화 요소 4) -->
          <button id="themeToggleBtn" class="hdr-btn theme-toggle-btn" type="button" title="심야 서재 캔들라이트 모드 전환"
            aria-label="테마 전환">
            <svg class="theme-icon-candle" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2c.6 1.5 2 2.5 2 4 0 1.5-1 2.5-2 3-1-.5-2-1.5-2-3 0-1.5 1.4-2.5 2-4z" fill="#d4af37"
                stroke="none" />
              <path d="M9 9h6v12H9z" />
              <path d="M7 21h10" />
            </svg>
            <span id="themeToggleText">캔들라이트</span>
          </button>
          <button id="exportBtn" class="hdr-btn" type="button" title="전체 데이터 내보내기">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            <span>내보내기</span>
          </button>
        </div>
      </header>
      <!-- 탭 내비게이션 -->
      <!-- 탭 내비게이션 (감성 다이어리 인덱스 탭) -->
      <nav class="tabs">
        <button class="tab active" data-tab="plans" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
          </svg>
          계획
        </button>
        <button class="tab" data-tab="calendar" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
            <path d="M8 14h.01" />
            <path d="M12 14h.01" />
            <path d="M16 14h.01" />
            <path d="M8 18h.01" />
            <path d="M12 18h.01" />
            <path d="M16 18h.01" />
          </svg>
          캘린더
        </button>
        <button class="tab" data-tab="todos" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4" />
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
          </svg>
          할 일
        </button>
        <button class="tab" data-tab="records" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          실행 기록
        </button>
        <button class="tab" data-tab="vlog" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
            <circle cx="12" cy="13" r="4" />
          </svg>
          사진·Vlog
        </button>
        <button class="tab" data-tab="review" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10" />
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="6" y1="20" x2="6" y2="14" />
          </svg>
          돌아보기
        </button>
      </nav>

      <!-- 다이어리 전체를 관통하는 은은한 중앙 제본선 (탭 상단부터 하단까지 연결) -->
      <div class="book-spine-line" aria-hidden="true"></div>

      <!-- 탭 콘텐츠 (실제 다이어리 북 속지) -->
      <main class="content">
        <!-- 실제 양장본 다이어리 유기적 3D 책 넘김 레이어 -->
        <div id="pageFlipLayer" class="page-flip-layer" hidden aria-hidden="true">
          <div id="flippingPage" class="flipping-page">
            <div class="page-face page-front">
              <div class="page-paper-surface"></div>
              <div class="page-cylinder-shading"></div>
            </div>
            <div class="page-face page-back">
              <div class="page-paper-surface"></div>
              <div class="page-cylinder-shading back"></div>
            </div>
          </div>
        </div>

        <!-- 계획 탭 -->
        <section id="tabPlans" class="tab-panel active">
          <div class="panel-header">
            <h2>내 계획</h2>
            <button id="addPlanBtn" class="btn-primary" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              새 계획
            </button>
          </div>
          <div id="plansList" class="card-list"></div>
        </section>

        <!-- 캘린더 다이어리 탭 (4번 이미지 형태) -->
        <section id="tabCalendar" class="tab-panel">
          <div class="panel-header">
            <div class="cal-nav-bar">
              <button id="calPrevBtn" class="btn-outline btn-sm" type="button" title="이전 달">&lt;</button>
              <div class="cal-jump-pickers">
                <select id="calYearSelect" class="select-sm cal-select"></select>
                <select id="calMonthSelect" class="select-sm cal-select"></select>
              </div>
              <button id="calNextBtn" class="btn-outline btn-sm" type="button" title="다음 달">&gt;</button>
              <button id="calTodayBtn" class="btn-outline btn-sm" type="button">오늘</button>
            </div>
            <button id="calAddTodoBtn" class="btn-primary btn-sm" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              일정 스티커 추가
            </button>
          </div>
          <div class="calendar-wrapper">
            <div class="cal-weekdays">
              <div class="cal-weekday sun">일</div>
              <div class="cal-weekday">월</div>
              <div class="cal-weekday">화</div>
              <div class="cal-weekday">수</div>
              <div class="cal-weekday">목</div>
              <div class="cal-weekday">금</div>
              <div class="cal-weekday sat">토</div>
            </div>
            <div id="calendarGrid" class="cal-grid"></div>
          </div>
          <!-- 4번 이미지 하단 다이어리 캐릭터 스티커 데코 -->
          <div class="diary-sticker-footer">
            <div class="cat-face-doodle">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;">
                <path
                  d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58 1.4 3.82-.25 5.56.54 1.25.83 2.63.83 4.44 0 5-4.03 9-9 9s-9-4-9-9c0-1.81.29-3.19.83-4.44C1.57 6.82 1.57 3.58 2.97 3c1.39-.58 4.64.26 6.42 2.26.65-.17 1.33-.26 2-.26z" />
                <circle cx="9" cy="13" r="1" fill="currentColor" />
                <circle cx="15" cy="13" r="1" fill="currentColor" />
                <path d="M10 16.5c1 .5 3 .5 4 0" />
              </svg>tong
            </div>
          </div>
        </section>

        <!-- 할 일 탭 -->
        <section id="tabTodos" class="tab-panel">
          <div class="panel-header">
            <h2>할 일</h2>
            <select id="planSelect" class="select"></select>
          </div>
          <div class="filter-bar">
            <input type="text" id="todoSearch" class="input-sm" placeholder="검색...">
            <select id="todoStatusFilter" class="select-sm">
              <option value="all">전체</option>
              <option value="진행중">진행중</option>
              <option value="보류">보류</option>
              <option value="완료">완료</option>
            </select>
            <select id="todoPriorityFilter" class="select-sm">
              <option value="all">우선순위</option>
              <option value="높음">높음</option>
              <option value="보통">보통</option>
              <option value="낮음">낮음</option>
            </select>
            <select id="todoSort" class="select-sm">
              <option value="created_desc" selected>최신순</option>
              <option value="created_asc">오래된순</option>
              <option value="due">마감일순</option>
              <option value="priority">우선순위순</option>
            </select>
          </div>
          <p class="sort-info" id="sortInfo">정렬: 최신순</p>
          <button id="addTodoBtn" class="btn-primary btn-sm" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
              stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            할 일 추가
          </button>
          <div id="todosList" class="card-list"></div>
        </section>

        <!-- 실행 기록 탭 -->
        <section id="tabRecords" class="tab-panel">
          <div class="panel-header">
            <h2>실행 기록</h2>
            <select id="recordPlanSelect" class="select"></select>
          </div>
          <div id="recordsList" class="card-list"></div>
        </section>

        <!-- 사진 / Vlog 일기 탭 (5번 이미지 형태) -->
        <section id="tabVlog" class="tab-panel">
          <div class="panel-header">
            <h2>사진 · Vlog 일기</h2>
            <button id="addVlogBtn" class="btn-primary btn-sm" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                <circle cx="12" cy="13" r="4" />
              </svg>
              새 포토·Vlog 일기
            </button>
          </div>
          <div id="vlogList" class="vlog-list"></div>
        </section>

        <!-- 돌아보기 탭 -->
        <section id="tabReview" class="tab-panel">
          <div class="panel-header">
            <h2>돌아보기</h2>
            <select id="reviewPlanSelect" class="select"></select>
          </div>
          <div id="reviewDash" class="dash-grid"></div>
          <div class="next-action-area" id="nextActionArea"></div>
          <div id="drillDownArea" class="drilldown-box" hidden></div>
        </section>

        <!-- 다이어리 양면 좌하단 / 우하단 페이지 번호 -->
        <div class="diary-book-folio" aria-hidden="true">
          <span id="pageFolioLeft" class="folio-num folio-left">- 1 -</span>
          <span id="pageFolioRight" class="folio-num folio-right">- 2 -</span>
        </div>
      </main>

      <!-- 토스트 -->
      <div id="globalToast" class="toast" role="alert" aria-live="polite"></div>

      <!-- 모달 -->
      <div id="modal" class="modal-overlay" hidden>
        <div class="modal-card">
          <div class="modal-header">
            <h3 id="modalTitle">제목</h3>
            <button id="modalClose" class="modal-x" type="button" aria-label="닫기">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
          <div id="modalBody" class="modal-body"></div>
        </div>
      </div>
    </div> <!-- /#diaryMainWrapper -->
  </div> <!-- /#app -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/plans.js"></script>
  <script src="js/todos.js"></script>
  <script src="js/records.js"></script>
  <script src="js/vlog.js"></script>
  <script src="js/review.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
